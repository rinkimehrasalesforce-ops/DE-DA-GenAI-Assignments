# The bundle's daily ETL job - same 5-task chain as claims_daily, but deployed
# per target (claims-etl-job-dev / claims-etl-job-prod) and parameterized by the
# bundle variables. ingest always writes the SHARED source catalog's bronze;
# dq_check + publish_gold operate on the target catalog's silver/gold.
resources:
  jobs:
    claims_etl_job:
      name: claims-etl-job-${bundle.target}
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: /Users/rinkimehrasalesforce@gmail.com/DE-Paper-1/Paper-1/01_bronze_claims_ingestion
            base_parameters:
              catalog: ${var.source_catalog}
          max_retries: 2
          min_retry_interval_millis: 30000
        - task_key: pipeline
          depends_on:
            - task_key: ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.claims_etl_pipeline.id}
        - task_key: dq_check
          depends_on:
            - task_key: pipeline
          notebook_task:
            notebook_path: /Users/rinkimehrasalesforce@gmail.com/DE-Paper-1/Paper-2/10_dq_check
            base_parameters:
              catalog: ${var.target_catalog}
        - task_key: dq_gate
          depends_on:
            - task_key: dq_check
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.dq_check.values.dq_problems}}"
            right: "0"
        - task_key: publish_gold
          depends_on:
            - task_key: dq_gate
              outcome: true
          notebook_task:
            notebook_path: /Users/rinkimehrasalesforce@gmail.com/DE-Paper-1/Paper-1/02_gold
            base_parameters:
              catalog: ${var.target_catalog}
              source_catalog: ${var.source_catalog}
